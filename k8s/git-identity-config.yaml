apiVersion: v1
kind: ConfigMap
metadata:
  name: git-identity
  labels:
    app.kubernetes.io/component: git-config
    app.kubernetes.io/part-of: dsh-web-access-notifier
data:
  GIT_USER_NAME: "maomao"
  GIT_USER_EMAIL: "replace-with-your-email@example.com"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: git-identity
  labels:
    app.kubernetes.io/component: git-config
    app.kubernetes.io/part-of: dsh-web-access-notifier
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # 按集群实际情况指定 StorageClass；删除此字段则使用默认 StorageClass。
  # storageClassName: local-path
